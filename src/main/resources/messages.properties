# Messages shown to end users. Every key must exist in each messages_*.properties.
#
# Messages with arguments go through java.text.MessageFormat, where a straight apostrophe (') is an
# escape character. Use the typographic apostrophe (U+2019) everywhere instead.

# Titles, by HTTP status
error.title.400=Bad request
error.title.401=Authentication required
error.title.403=Access denied
error.title.404=Not found
error.title.405=Method not allowed
error.title.406=Not acceptable
error.title.409=Conflict
error.title.413=Payload too large
error.title.415=Unsupported media type
error.title.422=Request cannot be processed
error.title.500=Internal server error
error.title.503=Service unavailable

# Generic details
error.badRequest=The request is invalid.
error.unauthenticated=You must be signed in to perform this action.
error.forbidden=You do not have permission to perform this action.
error.notFound=The requested resource was not found.
error.conflict=The request conflicts with the current state of the resource.
error.businessRule=The request cannot be processed.
error.internal=An unexpected error occurred. Please try again later. If the problem persists, contact support and include the correlation ID.
error.serviceUnavailable=The service is temporarily unavailable. Please try again later.

# Validation
error.validation=One or more fields are invalid.
error.validation.invalidValue=Invalid value.

# Request-level errors (arguments are API-defined names, never client values)
error.request.unreadable=The request body is malformed or contains unsupported fields.
error.request.typeMismatch=The value of ‘{0}’ has an invalid format.
error.request.missingParameter=The required parameter ‘{0}’ is missing.
error.request.missingHeader=The required header ‘{0}’ is missing.
error.request.methodNotSupported=This HTTP method is not supported for this resource.
error.request.mediaTypeNotSupported=This content type is not supported.
error.request.notAcceptable=None of the requested response formats is supported.
error.request.payloadTooLarge=The request is too large.
error.request.missingBody=A request body is required.
error.request.invalidPathParameter=Path parameter ‘{0}’ must be a positive number.
error.request.invalidQueryParameter=Query parameter ‘{0}’ must be a number between {1,number,#} and {2,number,#}.

# Domain
error.user.notFound=User {0,number,#} not found.
error.post.notFound=Post {0,number,#} not found.
error.profile.notFound=User {0,number,#} has no profile.
error.post.notAuthor=Only the author can change post {0,number,#}.
error.idempotencyKey.invalid=The ‘Idempotency-Key’ header must be 8 to 128 characters: letters, digits, ‘-’ or ‘_’.
error.idempotencyKey.reused=This Idempotency-Key was already used with a different request.
error.idempotencyKey.gone=This Idempotency-Key was already used for a post that no longer exists.
error.auth.invalid=Invalid credentials.

# Bean Validation messages
validation.safeText=Must be plain text (no HTML tags)
validation.noDuplicates=Must not contain duplicates

# Post
post.content.required=Content is required
post.content.size=Content must not exceed {max} characters
post.content.unsafe=Content must be plain text (no HTML tags)
post.imageUrls.size=A post can have at most {max} images
post.imageUrls.duplicate=Image URLs must be unique
post.imageUrl.required=Image URL is required
post.imageUrl.url=Image URL must be a valid https URL
post.imageUrl.size=Image URL must not exceed {max} characters

# Profile
profile.bio.size=Bio must not exceed {max} characters
profile.bio.unsafe=Bio must be plain text (no HTML tags)
profile.avatarUrl.url=Avatar URL must be a valid https URL
profile.avatarUrl.size=Avatar URL must not exceed {max} characters

# Auth
auth.email.required=Email is required
auth.email.invalid=Email must be a valid email address
auth.email.size=Email must not exceed {max} characters
