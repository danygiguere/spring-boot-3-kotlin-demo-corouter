# Single config for every environment. Defaults are production-safe: no seed data, no dev tokens, no Swagger UI.
# Local values come from .env (see .env.example); deployed environments set real environment variables.
spring:
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      initial-size: ${DB_POOL_INITIAL_SIZE:5}
      # Per instance: instances × max-size must stay under PostgreSQL max_connections.
      max-size: ${DB_POOL_MAX_SIZE:20}
      # Fail fast (500) instead of queueing requests forever when every connection is busy.
      max-acquire-time: ${DB_POOL_MAX_ACQUIRE_TIME:5s}
      max-create-connection-time: ${DB_POOL_MAX_CREATE_CONNECTION_TIME:5s}
      max-idle-time: ${DB_POOL_MAX_IDLE_TIME:10m}
      # Recycled before network devices or PostgreSQL drop them.
      max-life-time: ${DB_POOL_MAX_LIFE_TIME:30m}
    properties:
      connectTimeout: ${DB_CONNECT_TIMEOUT:5s}
      # Server-side cancel of any statement or lock wait running longer. Flyway (JDBC) is not affected.
      statementTimeout: ${DB_STATEMENT_TIMEOUT:5s}
      lockWaitTimeout: ${DB_LOCK_WAIT_TIMEOUT:2s}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Local: add classpath:db/seed (R__dev_seed.sql EMPTIES the tables before filling them).
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  jackson:
    deserialization:
      # Unknown request fields are rejected (400), never silently ignored.
      fail-on-unknown-properties: true
  codec:
    # Request body cap. The largest valid body (post: 5000 chars + 10 image URLs) is well under it.
    max-in-memory-size: 64KB

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  # Empty = all interfaces. DEV_TOKEN_ENABLED requires 127.0.0.1.
  address: ${SERVER_ADDRESS:}

app:
  jwt:
    # HS256 key, at least 32 bytes. No default: the application refuses to start without it.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:corouter-demo}
    audience: ${JWT_AUDIENCE:corouter-demo-api}
    ttl: ${JWT_TTL:15m}
  dev-token:
    # Passwordless POST /auth/dev-token. Local only.
    enabled: ${DEV_TOKEN_ENABLED:false}
